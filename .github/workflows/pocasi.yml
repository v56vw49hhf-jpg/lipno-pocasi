name: Lipno pocasi

on:
  workflow_dispatch:
    inputs:
      rezim:
        description: "forecast = aktualni predpoved, verify = zpetne vyhodnoceni, both = oboje"
        type: choice
        default: forecast
        options:
          - forecast
          - verify
          - both
      start:
        description: "Zacatek zpetneho vyhodnoceni (RRRR-MM-DD)"
        default: "2025-10-01"
  # GitHub planovane behy obcas vynecha, proto kontrola kazdou hodinu:
  # predpoved se spocita, jen kdyz od posledniho terminu (4:15, 10:15, 16:15, 22:15
  # mistniho casu) jeste zadna nevznikla. Ostatni kontroly skonci za par sekund.
  schedule:
    - cron: "25 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  kontrola:
    runs-on: ubuntu-latest
    outputs:
      bezet: ${{ steps.kdy.outputs.bezet }}
    steps:
      - name: Stahnout posledni predpoved
        uses: actions/checkout@v4
        with:
          sparse-checkout: out
      - name: Je cas na predpoved
        id: kdy
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "bezet=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, datetime as dt
          from zoneinfo import ZoneInfo
          tz = ZoneInfo("Europe/Prague")
          now = dt.datetime.now(tz)
          slots = []
          for d in (0, 1):
              day = (now - dt.timedelta(days=d)).date()
              for h in (4, 10, 16, 22):
                  slots.append(dt.datetime(day.year, day.month, day.day, h, 15, tzinfo=tz))
          last_slot = max(s for s in slots if s <= now)
          try:
              t = json.load(open("out/predpoved.json", encoding="utf-8"))["issued_utc"]
              issued = dt.datetime.strptime(t, "%Y-%m-%dT%H:%MZ").replace(tzinfo=dt.timezone.utc)
          except Exception:
              issued = None
          print("bezet=%d" % (issued is None or issued < last_slot))
          EOF
          cat "$GITHUB_OUTPUT"

  pocasi:
    needs: kontrola
    if: needs.kontrola.outputs.bezet == '1'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    concurrency:
      group: lipno-pocasi
      cancel-in-progress: false
    timeout-minutes: 75
    steps:
      - name: Stahnout kod
        uses: actions/checkout@v4
      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nainstalovat zavislosti
        run: pip install --quiet numpy pandas requests cairosvg
      - name: Spustit
        env:
          OPENMETEO_API_KEY: ${{ secrets.OPENMETEO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WU_API_KEY: ${{ secrets.WU_API_KEY }}
          REZIM: ${{ github.event.inputs.rezim || 'forecast' }}
          START: ${{ github.event.inputs.start || '2025-10-01' }}
        run: python pocasi.py "$REZIM" --start "$START"
      - name: Ulozit vystupy do repozitare
        if: always()
        run: |
          git config user.name "lipno-pocasi"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out 2>/dev/null || true
          git add data 2>/dev/null || true
          git add docs 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Vystupy $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -X theirs origin main || true
            git push
          fi
      - name: Pripravit stranku
        if: always() && hashFiles('docs/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Zverejnit stranku
        if: always() && hashFiles('docs/index.html') != ''
        uses: actions/deploy-pages@v4
